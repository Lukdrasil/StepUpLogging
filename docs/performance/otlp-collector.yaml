# A local OpenTelemetry Collector for ExporterBenchmarks (category Exporter): it accepts OTLP over gRPC,
# counts what it receives and throws it away. The benchmark reads the count from the internal metrics.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [debug]
