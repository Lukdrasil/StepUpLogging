name: Build, Test, and Publish NuGet Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: 'Publish to NuGet'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  PROJECT_PATH: 'src/Lukdrasil.StepUpLogging/Lukdrasil.StepUpLogging.csproj'
  TEST_PROJECT_PATH: 'tests/Lukdrasil.StepUpLogging/Lukdrasil.StepUpLogging.Tests.csproj'
  BENCHMARK_PROJECT_PATH: 'tests/Lukdrasil.StepUpLogging.Benchmarks/Lukdrasil.StepUpLogging.Benchmarks.csproj'

permissions:
  contents: read
  id-token: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '11.0.x'
    
    - name: Restore dependencies
      run: dotnet restore "${{ env.PROJECT_PATH }}" && dotnet restore "${{ env.TEST_PROJECT_PATH }}"

    - name: Build main library
      run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release /p:TreatWarningsAsErrors=true

    - name: Build tests
      run: dotnet build "${{ env.TEST_PROJECT_PATH }}" --configuration Release

    - name: Build benchmarks
      run: dotnet build "${{ env.BENCHMARK_PROJECT_PATH }}" --configuration Release

    - name: Run tests
      run: dotnet test --project "${{ env.TEST_PROJECT_PATH }}" --configuration Release

    - name: Create NuGet package
      run: dotnet pack "${{ env.PROJECT_PATH }}" --configuration Release --output ./nuget-packages
    
    - name: NuGet login (Trusted Publishing)
      id: nuget-login
      if: github.event_name == 'push' || github.event.inputs.publish_to_nuget == 'true'
      uses: NuGet/login@v1
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Publish to NuGet
      if: steps.nuget-login.outcome == 'success'
      run: dotnet nuget push ./nuget-packages/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Upload NuGet package as artifact
      uses: actions/upload-artifact@v5
      with:
        name: nuget-packages
        path: ./nuget-packages/
        retention-days: 90
